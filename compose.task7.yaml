services:
  node1:
    environment:
      NODE_ID: node-1
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
      HEARTBEAT_INTERVAL: '5'
      WORKER_TOKEN: local-development-worker-token
  node2:
    environment:
      NODE_ID: node-2
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
      HEARTBEAT_INTERVAL: '5'
      WORKER_TOKEN: local-development-worker-token
  node3:
    environment:
      NODE_ID: node-3
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
      HEARTBEAT_INTERVAL: '5'
      WORKER_TOKEN: local-development-worker-token
  node4:
    environment:
      NODE_ID: node-4
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
      HEARTBEAT_INTERVAL: '5'
      WORKER_TOKEN: local-development-worker-token
  node5:
    environment:
      NODE_ID: node-5
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
      HEARTBEAT_INTERVAL: '5'
      WORKER_TOKEN: local-development-worker-token
  node6:
    environment:
      NODE_ID: node-6
      STORAGE_DIR: /data
      METADATA_URL: http://metadata:8000
      HEARTBEAT_INTERVAL: '5'
      WORKER_TOKEN: local-development-worker-token
  gateway2:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      METADATA_URL: http://metadata:8000
      DATABASE_URL: postgresql://storage:storagepass@db:5432/distributed_storage
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-change-me-local-api-key}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - metadata
    restart: unless-stopped
  gateway-lb:
    image: nginx:1.27-alpine
    volumes:
      - ./task7/nginx/loadbalancer.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:18400:80'
    depends_on:
      - gateway
      - gateway2
    restart: unless-stopped
  frontend:
    volumes:
      - ./task7/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway-lb
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-midterm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-midterm-local-password}
    ports:
      - '127.0.0.1:15673:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD','rabbitmq-diagnostics','-q','ping']
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  repair-scheduler:
    build:
      context: .
      dockerfile: task7/queue/Dockerfile
    command: ['python','-u','scheduler.py']
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER:-midterm}:${RABBITMQ_PASSWORD:-midterm-local-password}@rabbitmq:5672/%2F
      SCHEDULE_INTERVAL: '30'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
  repair-queue-worker:
    build:
      context: .
      dockerfile: task7/queue/Dockerfile
    command: ['python','-u','worker.py']
    environment:
      AMQP_URL: amqp://${RABBITMQ_USER:-midterm}:${RABBITMQ_PASSWORD:-midterm-local-password}@rabbitmq:5672/%2F
      METADATA_URL: http://metadata:8000
      WORKER_TOKEN: local-development-worker-token
    depends_on:
      rabbitmq:
        condition: service_healthy
      metadata:
        condition: service_started
    restart: unless-stopped
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://gateway-lb/nginx_status"]
    depends_on: [gateway-lb]
    restart: unless-stopped
  cluster-metrics:
    build:
      context: .
      dockerfile: task7/monitoring/Dockerfile
    environment:
      CLUSTER_URL: http://metadata:8000/task4/cluster
      DATABASE_URL: postgresql://storage:storagepass@db:5432/distributed_storage
    depends_on:
      - metadata
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.path=/prometheus','--web.enable-lifecycle']
    volumes:
      - ./task7/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:19090:9090'
    depends_on:
      - cluster-metrics
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin-local-change-me}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./task7/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./task7/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:13000:3000'
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
