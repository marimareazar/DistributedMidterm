apiVersion: v1
kind: Service
metadata:
  name: metadata
  namespace: distributed-midterm
spec:
  selector: {app: metadata}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata
  namespace: distributed-midterm
spec:
  replicas: 1
  selector: {matchLabels: {app: metadata}}
  template:
    metadata: {labels: {app: metadata}}
    spec:
      containers:
        - name: metadata
          image: distributedmidterm-metadata:task7
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: midterm-config}
            - secretRef: {name: midterm-credentials}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
