apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: distributed-midterm
spec:
  selector: {app: gateway}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: distributed-midterm
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: distributedmidterm-gateway:task7
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: midterm-config}
            - secretRef: {name: midterm-credentials}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
