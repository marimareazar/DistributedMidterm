global:
  scrape_interval: 10s
  evaluation_interval: 10s
scrape_configs:
  - job_name: distributed-storage
    metrics_path: /metrics
    static_configs:
      - targets: ['cluster-metrics:9109']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: nginx-load-balancer
    static_configs:
      - targets: ['nginx-exporter:9113']
