upstream distributed_gateways {
    least_conn;
    server gateway:8000 max_fails=2 fail_timeout=10s;
    server gateway2:8000 max_fails=2 fail_timeout=10s;
    keepalive 16;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 2048m;
    location /nginx_status {
        stub_status;
        # Container-only metrics endpoint; port exposed only to loopback on host.
    }
    location / {
        proxy_pass http://distributed_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header Range $http_range;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Load-Balancer task7-nginx always;
    }
}
